<script type="module">
const STORAGE_KEY = 'gre-single-v1';
const AUTH_KEY = 'gre-single-auth-v1';
const GIST_MARKER = 'GRE-PREP-SYNC-v1';
const GIST_FILENAME = 'gre-prep-data.json';
const GH_API = 'https://api.github.com';

/** 云同步会话：Token 只留在内存；落盘时用保护密码 AES 加密 */
let cloud = {
  token: null,
  login: null,
  gistId: null,
  lastSyncAt: null,
  autoSync: true,
  unlocked: false,
};
let syncTimer = null;
let syncing = false;

const WORD_STATUS = { NEW:'new', LEARNING:'learning', MASTERED:'mastered' };
const PLAN = { TOTAL_DAYS:16, NEW_PER_DAY:200, MISTAKE_PER_DAY:300, REVIEW_LAG:2 };

const SEED = [
  {id:1,word:'abate',phonetic:'/əˈbeɪt/',definition:'vt./vi. 减弱，减轻，缓和'},
  {id:2,word:'aberrant',phonetic:'/æˈberənt/',definition:'adj. 异常的，反常的'},
  {id:3,word:'abscond',phonetic:'/əbˈskɒnd/',definition:'vi. 潜逃，逃匿'},
  {id:4,word:'abstemious',phonetic:'/æbˈstiːmiəs/',definition:'adj. 有节制的，节俭的'},
  {id:5,word:'admonish',phonetic:'/ədˈmɒnɪʃ/',definition:'vt. 告诫，劝告'},
  {id:6,word:'aesthetic',phonetic:'/iːsˈθetɪk/',definition:'adj. 审美的，美学的'},
  {id:7,word:'alacrity',phonetic:'/əˈlækrəti/',definition:'n. 欣然同意，乐意'},
  {id:8,word:'ameliorate',phonetic:'/əˈmiːliəreɪt/',definition:'vt. 改善，改良'},
  {id:9,word:'anachronism',phonetic:'/əˈnækrənɪzəm/',definition:'n. 时代错误，过时之物'},
  {id:10,word:'anomaly',phonetic:'/əˈnɒməli/',definition:'n. 异常，反常'},
  {id:11,word:'antipathy',phonetic:'/ænˈtɪpəθi/',definition:'n. 反感，厌恶'},
  {id:12,word:'apathy',phonetic:'/ˈæpəθi/',definition:'n. 冷漠，无动于衷'},
  {id:13,word:'appease',phonetic:'/əˈpiːz/',definition:'vt. 平息，安抚'},
  {id:14,word:'arbitrary',phonetic:'/ˈɑːbɪtrəri/',definition:'adj. 任意的，武断的'},
  {id:15,word:'arduous',phonetic:'/ˈɑːdjuəs/',definition:'adj. 费力的，艰巨的'},
  {id:16,word:'articulate',phonetic:'/ɑːˈtɪkjuleɪt/',definition:'adj. 善于表达的；vt. 清晰表达'},
  {id:17,word:'assuage',phonetic:'/əˈsweɪdʒ/',definition:'vt. 缓和，减轻'},
  {id:18,word:'audacious',phonetic:'/ɔːˈdeɪʃəs/',definition:'adj. 大胆的，鲁莽的'},
  {id:19,word:'austere',phonetic:'/ɒˈstɪə/',definition:'adj. 朴素的，严厉的'},
  {id:20,word:'belie',phonetic:'/bɪˈlaɪ/',definition:'vt. 掩饰，与…不符'},
];

function todayStr(){ return new Date().toISOString().slice(0,10); }
function makeId(p='id'){ return `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`; }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escapeRegExp(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function wrapWord(w){
  return {
    ...w,
    status: WORD_STATUS.NEW,
    learnedDay: null,
    targetDay: null,
    mistakeLevel: 0,
    reviewCount: 0,
    lastReviewTime: null,
    contextSentence: w.contextSentence || '',
  };
}

function defaultBook(){
  return {
    id: makeId('book'),
    name: 'KMF 核心词',
    currentPlanDay: 1,
    words: SEED.map(wrapWord),
    practiceHistory: [],
    progress: { wordsLearnedToday:0, todayTarget:0, todayTargetDate:null, lastActiveDate:todayStr() },
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed?.wordbooks?.length){
        parsed.wordbooks.forEach(b=>{
          if(!Array.isArray(b.practiceHistory)) b.practiceHistory=[];
          if(!Array.isArray(b.words)) b.words=[];
        });
        return parsed;
      }
    }
  }catch(e){ console.warn(e); }
  const book = defaultBook();
  return { activeBookId: book.id, wordbooks:[book] };
}

let state = loadState();
function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  scheduleCloudPush();
}
function activeBook(){
  let b = state.wordbooks.find(x=>x.id===state.activeBookId);
  if(!b){ b=state.wordbooks[0]; state.activeBookId=b.id; }
  return b;
}

function getStats(){
  const all = activeBook().words;
  return {
    total: all.length,
    newCount: all.filter(w=>w.status===WORD_STATUS.NEW).length,
    learningCount: all.filter(w=>w.status===WORD_STATUS.LEARNING).length,
    masteredCount: all.filter(w=>w.status===WORD_STATUS.MASTERED).length,
    mistakeCount: all.filter(w=>w.mistakeLevel>0).length,
    contextCount: all.filter(w=>String(w.contextSentence||'').trim()).length,
  };
}

function buildTodayQueue(){
  const book = activeBook();
  const all = book.words;
  const day = book.currentPlanDay;
  if(day>=10) return shuffle(all.filter(w=>w.mistakeLevel>0)).slice(0, PLAN.MISTAKE_PER_DAY);
  let newWords=[];
  if(day<=7){
    const learned = all.filter(w=>w.learnedDay===day).length;
    const allowance = Math.max(0, Math.min(20, PLAN.NEW_PER_DAY) - learned);
    const pool = all.filter(w=>w.status===WORD_STATUS.NEW && w.learnedDay===null);
    newWords = shuffle(pool).slice(0, allowance);
  }
  let review=[];
  if(day>=3) review = all.filter(w=>w.learnedDay===day-PLAN.REVIEW_LAG);
  return [...newWords, ...review];
}

function getTodayTask(){
  const book = activeBook();
  const p = book.progress;
  if(p.lastActiveDate !== todayStr()){ p.wordsLearnedToday=0; p.todayTarget=0; p.todayTargetDate=null; p.lastActiveDate=todayStr(); persist(); }
  if(p.todayTargetDate!==todayStr() || !p.todayTarget){
    p.todayTarget = buildTodayQueue().length;
    p.todayTargetDate = todayStr();
    persist();
  }
  return { day: book.currentPlanDay, bookName: book.name, learnedToday: p.wordsLearnedToday||0, todayGoal: p.todayTarget||0, remaining: Math.max(0,(p.todayTarget||0)-(p.wordsLearnedToday||0)) };
}

function extractContextSentence(article, word){
  const text = String(article||'');
  const target = String(word||'').trim();
  if(!text||!target) return '';
  const re = new RegExp(`\\b${escapeRegExp(target)}\\b`,'i');
  const match = re.exec(text);
  let wordStart, wordEnd;
  if(match){ wordStart=match.index; wordEnd=match.index+match[0].length; }
  else {
    const idx = text.toLowerCase().indexOf(target.toLowerCase());
    if(idx<0) return '';
    wordStart=idx; wordEnd=idx+target.length;
  }
  const terminators = '.?!。？！';
  let end = text.length;
  for(let i=wordEnd;i<text.length;i++){ if(terminators.includes(text[i])){ end=i+1; break; } }
  let start=0, found=false;
  for(let i=wordStart-1;i>=0;i--){ if(terminators.includes(text[i])){ start=i+1; found=true; break; } }
  while(start<wordStart && /\s/.test(text[start])) start++;
  if(!found){
    for(let i=wordStart-1;i>=0;i--){
      if(/[A-Z]/.test(text[i])){
        const prev = i===0?' ':text[i-1];
        if(i===0 || /[\s"'“‘(\[]/.test(prev)){ start=i; break; }
      }
    }
  }
  return text.slice(start,end).replace(/\s+/g,' ').trim();
}

function highlightWordHtml(sentence, word){
  const safe = escapeHtml(String(sentence||''));
  const target = String(word||'').trim();
  if(!target) return safe;
  return safe.replace(new RegExp(`\\b(${escapeRegExp(target)})\\b`,'gi'),
    '<strong class="font-bold text-brand-700 bg-brand-50 px-0.5 rounded">$1</strong>');
}

let speakAudio = null;
function speak(word){
  try{
    if(speakAudio){ speakAudio.pause(); speakAudio=null; }
    const url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=1`;
    speakAudio = new Audio(url);
    speakAudio.play().catch(()=>{});
  }catch(e){}
}

function markAsSprintMistake(wordId, sentence){
  const book = activeBook();
  const w = book.words.find(x=>x.id===wordId);
  if(!w) return {ok:false,message:'未找到该单词'};
  w.mistakeLevel = 2;
  if(w.status===WORD_STATUS.NEW) w.status=WORD_STATUS.LEARNING;
  if(sentence) w.contextSentence = sentence;
  persist();
  return {ok:true, word:w, message:`「${w.word}」已加入冲刺错词本`};
}

function savePractice(article, notes){
  const text = String(article||'').trim();
  if(!text) return {ok:false,message:'请先粘贴一条文章再保存。'};
  const book = activeBook();
  const record = {
    id: makeId('practice'),
    timestamp: Date.now(),
    article: text,
    notes: String(notes||''),
    preview: text.replace(/\s+/g,' ').slice(0,30),
  };
  book.practiceHistory.unshift(record);
  persist();
  return {ok:true, message:'当前演练已保存。'};
}

function getPracticeHistory(){ return [...(activeBook().practiceHistory||[])].sort((a,b)=>b.timestamp-a.timestamp); }
function deletePractice(id){
  const book = activeBook();
  const before = book.practiceHistory.length;
  book.practiceHistory = book.practiceHistory.filter(r=>r.id!==id);
  if(book.practiceHistory.length===before) return {ok:false,message:'未找到记录'};
  persist();
  return {ok:true};
}

function updateWord(id, mutator){
  const w = activeBook().words.find(x=>x.id===id);
  if(!w) return null;
  mutator(w);
  persist();
  return w;
}

function gradeWord(id, known){
  const book = activeBook();
  const w = book.words.find(x=>x.id===id);
  if(!w) return;
  if(known){
    w.status = WORD_STATUS.MASTERED;
    if(w.mistakeLevel>0) w.mistakeLevel = Math.max(0, w.mistakeLevel-1);
  } else {
    w.status = WORD_STATUS.LEARNING;
    w.mistakeLevel = Math.min(2, (w.mistakeLevel||0)+1);
  }
  if(w.learnedDay==null) w.learnedDay = book.currentPlanDay;
  w.reviewCount = (w.reviewCount||0)+1;
  w.lastReviewTime = Date.now();
  book.progress.wordsLearnedToday = (book.progress.wordsLearnedToday||0)+1;
  persist();
  window.dispatchEvent(new Event('gre:progress'));
}

function advanceDay(){
  const book = activeBook();
  if(book.currentPlanDay < PLAN.TOTAL_DAYS){
    book.currentPlanDay += 1;
    book.progress.wordsLearnedToday = 0;
    book.progress.todayTarget = 0;
    book.progress.todayTargetDate = null;
    persist();
    window.dispatchEvent(new Event('gre:progress'));
    return true;
  }
  return false;
}

function appendWords(lines){
  const book = activeBook();
  const by = new Map(book.words.map(w=>[w.word.toLowerCase(),w]));
  let maxId = book.words.reduce((m,w)=>Math.max(m,w.id||0),0);
  let added=0, skipped=0; const dups=[];
  for(const line of lines){
    const parts = line.split(/\t+/).map(s=>s.trim()).filter(Boolean);
    if(parts.length<2) continue;
    const word = parts[0];
    const key = word.toLowerCase();
    if(by.has(key)){ skipped++; dups.push(word); continue; }
    maxId++;
    const rec = wrapWord({
      id:maxId, word,
      phonetic: parts.length>=3?parts[1]:'',
      definition: parts.length>=3?parts[2]:parts[1],
    });
    book.words.push(rec);
    by.set(key, rec);
    added++;
  }
  persist();
  return {added, skipped, duplicateWords:dups, total:book.words.length};
}


// ---------- GitHub Gist 云同步 ----------
function bytesToB64(bytes){
  let s=''; const a=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);
  for(let i=0;i<a.length;i++) s+=String.fromCharCode(a[i]);
  return btoa(s);
}
function b64ToBytes(b64){
  const s=atob(b64); const out=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) out[i]=s.charCodeAt(i);
  return out;
}
async function deriveKey(passphrase, salt){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:120000, hash:'SHA-256'},
    base,
    {name:'AES-GCM', length:256},
    false,
    ['encrypt','decrypt']
  );
}
function assertCrypto(){
  if(!globalThis.crypto?.subtle){
    throw new Error('当前环境不支持安全加密。请用 GitHub Pages 的 https 链接打开本页（不要用本地文件直接打开）。');
  }
}
async function encryptToken(token, passphrase){
  assertCrypto();
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(passphrase, salt);
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(token));
  return { v:1, salt:bytesToB64(salt), iv:bytesToB64(iv), cipher:bytesToB64(cipher) };
}
async function decryptToken(blob, passphrase){
  assertCrypto();
  const key=await deriveKey(passphrase, b64ToBytes(blob.salt));
  const plain=await crypto.subtle.decrypt(
    {name:'AES-GCM', iv:b64ToBytes(blob.iv)},
    key,
    b64ToBytes(blob.cipher)
  );
  return new TextDecoder().decode(plain);
}

function loadAuthMeta(){
  try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch{ return null; }
}
function saveAuthMeta(meta){
  localStorage.setItem(AUTH_KEY, JSON.stringify(meta));
}
function clearAuthMeta(){
  localStorage.removeItem(AUTH_KEY);
  sessionStorage.removeItem(AUTH_KEY+':session');
}

function loadSessionToken(){
  try{ return sessionStorage.getItem(AUTH_KEY+':session')||null; }catch{ return null; }
}
function saveSessionToken(token){
  sessionStorage.setItem(AUTH_KEY+':session', token);
}

async function ghFetch(path, opts={}){
  if(!cloud.token) throw new Error('尚未登录 GitHub');
  const res = await fetch(GH_API+path, {
    ...opts,
    headers: {
      'Accept': 'application/vnd.github+json',
      'Authorization': `Bearer ${cloud.token}`,
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.body ? {'Content-Type':'application/json'} : {}),
      ...(opts.headers||{}),
    },
  });
  const textBody = await res.text();
  let data=null;
  try{ data = textBody ? JSON.parse(textBody) : null; }catch{ data={ raw:textBody }; }
  if(!res.ok){
    const msg = data?.message || res.statusText || ('HTTP '+res.status);
    throw new Error(msg);
  }
  return data;
}

function buildCloudPayload(){
  return {
    app: GIST_MARKER,
    updatedAt: Date.now(),
    state,
  };
}

async function findOrCreateGist(){
  if(cloud.gistId){
    try{
      const g = await ghFetch('/gists/'+cloud.gistId);
      if(g?.id) return g;
    }catch{ cloud.gistId=null; }
  }
  // 扫描最近 gists，找标记文件
  const list = await ghFetch('/gists?per_page=50');
  const found = (list||[]).find(g =>
    (g.description||'').includes(GIST_MARKER) ||
    (g.files && g.files[GIST_FILENAME])
  );
  if(found){
    cloud.gistId = found.id;
    return await ghFetch('/gists/'+found.id);
  }
  // 新建私有 Gist
  const created = await ghFetch('/gists', {
    method:'POST',
    body: JSON.stringify({
      description: `${GIST_MARKER} · GRE备考进度同步（请勿公开）`,
      public: false,
      files: {
        [GIST_FILENAME]: {
          content: JSON.stringify(buildCloudPayload(), null, 2),
        },
      },
    }),
  });
  cloud.gistId = created.id;
  return created;
}

function applyRemoteState(payload){
  if(!payload?.state?.wordbooks?.length) return false;
  state = payload.state;
  state.wordbooks.forEach(b=>{
    if(!Array.isArray(b.practiceHistory)) b.practiceHistory=[];
    if(!Array.isArray(b.words)) b.words=[];
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  return true;
}

async function pullFromGist(){
  const gist = await findOrCreateGist();
  const file = gist.files?.[GIST_FILENAME];
  if(!file) return { ok:true, message:'云端尚无数据，将在下次保存时上传', pulled:false };
  let content = file.content;
  if(!content && file.raw_url){
    const r = await fetch(file.raw_url, {
      headers:{ Authorization:`Bearer ${cloud.token}`, Accept:'application/vnd.github.raw' },
    });
    content = await r.text();
  }
  const payload = JSON.parse(content);
  const remoteAt = Number(payload.updatedAt)||0;
  const localRaw = localStorage.getItem(STORAGE_KEY);
  let localAt = 0;
  try{
    // 用 meta 或启发式：没有本地时间戳时，若本地几乎是默认则拉云端
    const meta = loadAuthMeta();
    localAt = Number(meta?.localUpdatedAt)||0;
  }catch{}
  // 若云端更新，覆盖本地
  if(remoteAt >= localAt){
    applyRemoteState(payload);
    cloud.lastSyncAt = Date.now();
    persistAuthSide();
    return { ok:true, message:'已从云端拉取最新进度', pulled:true, remoteAt };
  }
  cloud.lastSyncAt = Date.now();
  persistAuthSide();
  return { ok:true, message:'本地更新，保留本地数据（稍后会推送）', pulled:false, remoteAt };
}

async function pushToGist(){
  if(!cloud.token) return { ok:false, message:'未登录' };
  const gist = await findOrCreateGist();
  const payload = buildCloudPayload();
  await ghFetch('/gists/'+gist.id, {
    method:'PATCH',
    body: JSON.stringify({
      files: {
        [GIST_FILENAME]: { content: JSON.stringify(payload, null, 2) },
      },
    }),
  });
  cloud.lastSyncAt = Date.now();
  const meta = loadAuthMeta()||{};
  meta.localUpdatedAt = payload.updatedAt;
  meta.lastSyncAt = cloud.lastSyncAt;
  meta.gistId = cloud.gistId;
  meta.login = cloud.login;
  saveAuthMeta({ ...meta, localUpdatedAt: payload.updatedAt, lastSyncAt: cloud.lastSyncAt, gistId: cloud.gistId, login: cloud.login });
  return { ok:true, message:'已同步到云端 Gist', at: payload.updatedAt };
}

function scheduleCloudPush(){
  const meta = loadAuthMeta()||{};
  meta.localUpdatedAt = Date.now();
  if(cloud.login) meta.login = cloud.login;
  if(cloud.gistId) meta.gistId = cloud.gistId;
  saveAuthMeta({ ...(loadAuthMeta()||{}), ...meta });
  if(!cloud.token || !cloud.autoSync || syncing) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async ()=>{
    try{
      syncing = true;
      await pushToGist();
      updateSyncBadge('已自动同步');
    }catch(e){
      updateSyncBadge('同步失败: '+(e.message||e));
      console.warn('cloud push failed', e);
    }finally{ syncing=false; }
  }, 1500);
}

function persistAuthSide(){
  const prev = loadAuthMeta()||{};
  saveAuthMeta({
    ...prev,
    login: cloud.login,
    gistId: cloud.gistId,
    lastSyncAt: cloud.lastSyncAt,
    autoSync: cloud.autoSync,
  });
}

async function githubLogin(token, opts={}){
  const clean = String(token||'').trim();
  if(!clean) throw new Error('请粘贴 GitHub Token');
  if(!clean.startsWith('ghp_') && !clean.startsWith('github_pat_')){
    // 仍允许，但提示
  }
  cloud.token = clean;
  const user = await ghFetch('/user');
  cloud.login = user.login;
  cloud.gistId = opts.gistId || loadAuthMeta()?.gistId || null;
  cloud.autoSync = opts.autoSync !== false;
  cloud.unlocked = true;

  // Token 保存策略
  if(opts.remember){
    const pass = String(opts.passphrase||'').trim();
    if(pass.length < 4) throw new Error('记住登录时，保护密码至少 4 位');
    const enc = await encryptToken(clean, pass);
    saveAuthMeta({
      mode: 'encrypted',
      enc,
      login: cloud.login,
      gistId: cloud.gistId,
      lastSyncAt: cloud.lastSyncAt,
      autoSync: cloud.autoSync,
      localUpdatedAt: loadAuthMeta()?.localUpdatedAt || Date.now(),
    });
    sessionStorage.removeItem(AUTH_KEY+':session');
  }else{
    saveSessionToken(clean);
    saveAuthMeta({
      mode: 'session',
      login: cloud.login,
      gistId: cloud.gistId,
      lastSyncAt: cloud.lastSyncAt,
      autoSync: cloud.autoSync,
      localUpdatedAt: loadAuthMeta()?.localUpdatedAt || Date.now(),
    });
  }

  const pull = await pullFromGist();
  // 若没拉到更新，把本地推上去，保证两端有底
  if(!pull.pulled) await pushToGist();
  updateSyncBadge(`已登录 @${cloud.login}`);
  window.dispatchEvent(new Event('gre:progress'));
  return { user, pull };
}

function githubLogout(){
  cloud = { token:null, login:null, gistId: loadAuthMeta()?.gistId||null, lastSyncAt:null, autoSync:true, unlocked:false };
  clearAuthMeta();
  updateSyncBadge('未登录');
}

async function tryRestoreSession(){
  const meta = loadAuthMeta();
  if(!meta) { updateSyncBadge('未登录'); return; }
  cloud.login = meta.login||null;
  cloud.gistId = meta.gistId||null;
  cloud.lastSyncAt = meta.lastSyncAt||null;
  cloud.autoSync = meta.autoSync !== false;
  if(meta.mode==='session'){
    const t = loadSessionToken();
    if(t){
      cloud.token = t;
      cloud.unlocked = true;
      try{
        await pullFromGist();
        updateSyncBadge(`已登录 @${cloud.login}`);
        renderChrome();
      }catch(e){
        updateSyncBadge('会话失效，请重新登录');
        cloud.token=null; cloud.unlocked=false;
      }
    }else{
      updateSyncBadge(meta.login ? `已记住 @${meta.login}（会话结束，请重新粘贴 Token）` : '未登录');
    }
  }else if(meta.mode==='encrypted'){
    updateSyncBadge(`@${meta.login||'?'} 待解锁`);
  }else{
    updateSyncBadge(meta.login?`@${meta.login}`:'未登录');
  }
}

async function unlockEncrypted(passphrase){
  const meta = loadAuthMeta();
  if(!meta?.enc) throw new Error('没有可解锁的登录信息');
  const token = await decryptToken(meta.enc, passphrase);
  cloud.token = token;
  cloud.login = meta.login;
  cloud.gistId = meta.gistId;
  cloud.autoSync = meta.autoSync !== false;
  cloud.unlocked = true;
  await pullFromGist();
  updateSyncBadge(`已解锁 @${cloud.login}`);
  window.dispatchEvent(new Event('gre:progress'));
}

function updateSyncBadge(text){
  const el = document.getElementById('sync-badge');
  if(el) el.textContent = text;
}

function formatSyncTime(ts){
  if(!ts) return '尚未同步';
  return new Date(ts).toLocaleString('zh-CN');
}

    const tip=document.createElement('div'); tip.className='gre-word-tooltip';
    tip.innerHTML=`<div class="flex justify-between gap-2"><div>
      <div class="flex items-center gap-2"><span class="font-bold">${escapeHtml(entry.word)}</span><button class="tip-speak text-lg">🔊</button></div>
      <p class="text-xs text-slate-400">${escapeHtml(entry.phonetic||'')}</p>
      <p class="text-sm mt-1">${escapeHtml(entry.definition||'')}</p></div>
      <button class="tip-x text-slate-300">×</button></div>
      ${sentence?`<p class="mt-2 text-xs text-slate-400 italic border-t pt-2">「${escapeHtml(sentence.slice(0,160))}」</p>`:''}
      <button class="tip-add mt-3 w-full bg-accent text-white text-xs font-semibold py-2 rounded-lg">加入冲刺错词本</button>
      <p class="tip-fb text-xs text-center mt-1.5 text-brand-600 min-h-[1rem]"></p>`;
    document.body.appendChild(tip); activeTip=tip;
    const rect=el.getBoundingClientRect(), tr=tip.getBoundingClientRect();
    let top=scrollY+rect.top-tr.height-10, left=scrollX+rect.left+rect.width/2-tr.width/2;
    if(top<scrollY+8) top=scrollY+rect.bottom+10;
    tip.style.top=`${top}px`; tip.style.left=`${Math.max(8,left)}px`;
    tip.querySelector('.tip-speak').onclick=e=>{e.stopPropagation();speak(entry.word);};
    tip.querySelector('.tip-x').onclick=e=>{e.stopPropagation();hideTip();};
    tip.querySelector('.tip-add').onclick=e=>{
      e.stopPropagation();
      const r=markAsSprintMistake(entry.id, sentence);
      tip.querySelector('.tip-fb').textContent=r.ok?`✅ ${r.message}`:`❌ ${r.message}`;
      if(r.ok) document.querySelectorAll(`.gre-hit[data-id="${entry.id}"]`).forEach(n=>{n.className='gre-hit gre-hit-mistake';});
      window.dispatchEvent(new Event('gre:progress'));
    };
  }
  function hideTip(){ if(activeTip){ activeTip.remove(); activeTip=null; } }
  function refreshHist(){ const h=getPracticeHistory(); list.innerHTML=renderHist(h); count.textContent=`${h.length} 条`; }
  root.querySelector('#p-parse').onclick=parse;
  root.querySelector('#p-clear').onclick=()=>{ hideTip(); input.value=''; notes.value=''; lastArticle=''; article.innerHTML='<p class="text-slate-300 text-sm italic">解析后显示文章与高亮词</p>'; msg.textContent=''; };
  root.querySelector('#p-save').onclick=()=>{ const r=savePractice(input.value, notes.value); alert(r.ok?`✅ ${r.message}`:r.message); if(r.ok) refreshHist(); };
  list.onclick=e=>{
    const btn=e.target.closest('[data-act]'); if(!btn) return;
    const card=btn.closest('[data-id]'); const id=card.dataset.id;
    if(btn.dataset.act==='del'){ if(!confirm('删除这条记录？')) return; deletePractice(id); refreshHist(); return; }
    const rec=getPracticeHistory().find(r=>r.id===id); if(!rec) return;
    input.value=rec.article||''; notes.value=rec.notes||''; parse();
    msg.textContent=(msg.textContent||'')+' · 已从历史恢复并重新高亮';
  };
  document.removeEventListener('click', onDocTip);
  document.addEventListener('click', onDocTip);
  function onDocTip(e){ if(!activeTip) return; if(activeTip.contains(e.target)||e.target.closest?.('.gre-hit')) return; hideTip(); }
}

function renderSentence(){
  const items=activeBook().words.filter(w=>String(w.contextSentence||'').trim());
  if(!items.length) return `<div class="max-w-3xl mx-auto bg-white rounded-2xl border border-dashed p-16 text-center view-fade">
    <p class="text-4xl mb-3">🧩</p>
    <p class="text-slate-700 font-medium">暂无数据，请前往【真题演练】区做题并捕获生词</p>
    <a href="#/practice" class="inline-block mt-6 bg-brand-600 text-white text-sm font-semibold px-5 py-2.5 rounded-lg">打开真题演练</a>
  </div>`;
  return `<div class="max-w-5xl mx-auto space-y-4 view-fade">
    <div class="bg-white rounded-2xl p-6 border"><h2 class="text-lg font-semibold">长难句 · 专属语境本</h2>
    <p class="text-sm text-slate-400 mt-1">共 ${items.length} 句</p></div>
    <div class="columns-1 md:columns-2 gap-4 space-y-4">${items.map(w=>`
      <article class="break-inside-avoid bg-white rounded-2xl border p-5 mb-4">
        <div class="flex items-center gap-2"><span class="font-bold text-lg">${escapeHtml(w.word)}</span>
        <button data-speak="${escapeAttr(w.word)}" class="text-lg">🔊</button></div>
        <p class="text-sm text-slate-600 mt-1">${escapeHtml(w.definition||'')}</p>
        <div class="mt-4 bg-slate-50 border-l-4 border-brand-500 rounded-r-xl px-4 py-3">
          <p class="text-xs font-semibold text-slate-500 mb-1">🎯 真题语境原句</p>
          <p class="text-sm">「${highlightWordHtml(w.contextSentence,w.word)}」</p>
        </div>
      </article>`).join('')}</div></div>`;
}
function mountSentence(root){ root.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak)); }

function renderSettings(){
  const task=getTodayTask();
  const meta=loadAuthMeta();
  const logged = !!(cloud.token && cloud.unlocked);
  const needUnlock = !!(meta?.mode==='encrypted' && !cloud.unlocked);
  return `<div class="max-w-3xl mx-auto space-y-4 view-fade">
    <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200">
      <h2 class="text-lg font-semibold">☁️ GitHub 云同步（免费）</h2>
      <p class="text-xs text-slate-400 mt-1 leading-relaxed">
        用你的 GitHub 账号把进度存到<strong>私有 Gist</strong>。手机与电脑打开本页并登录同一账号即可自动同步。
      </p>
      <div class="mt-3 rounded-xl bg-slate-50 border border-slate-100 px-3 py-2 text-xs text-slate-600 space-y-1">
        <p>状态：<span class="font-semibold text-brand-700">${escapeHtml(logged ? ('已登录 @'+cloud.login) : (needUnlock ? ('待解锁 @'+(meta.login||'')) : (meta?.login ? ('曾登录 @'+meta.login) : '未登录')))}</span></p>
        <p>上次同步：${escapeHtml(formatSyncTime(cloud.lastSyncAt || meta?.lastSyncAt))}</p>
        <p>Gist：${cloud.gistId || meta?.gistId ? ('…'+String(cloud.gistId||meta.gistId).slice(-8)) : '尚未创建'}</p>
      </div>

      ${needUnlock ? `
      <div class="mt-4 space-y-2 border-t border-slate-100 pt-4">
        <p class="text-sm font-medium text-slate-800">输入保护密码解锁 Token</p>
        <input id="s-unlock-pass" type="password" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="保护密码" />
        <button id="s-unlock" class="bg-brand-600 text-white text-sm font-semibold px-4 py-2 rounded-lg">解锁并同步</button>
        <button id="s-forget" class="ml-2 text-sm text-slate-500 underline">清除本地登录</button>
        <p id="s-unlock-msg" class="text-xs text-slate-400"></p>
      </div>` : `
      <div class="mt-4 space-y-3 border-t border-slate-100 pt-4 ${logged?'opacity-60':''}">
        <p class="text-sm font-medium text-slate-800">1. 创建 Token（仅勾选 gist 权限）</p>
        <ol class="text-xs text-slate-500 list-decimal pl-4 space-y-1">
          <li>打开 <a class="text-brand-600 underline" target="_blank" rel="noopener" href="https://github.com/settings/tokens?type=beta">GitHub → Settings → Fine-grained tokens</a></li>
          <li>权限里只开 <code class="bg-slate-100 px-1 rounded">Gists: Read and write</code>（不要给 repo 权限）</li>
          <li>复制 Token，粘贴到下方（形如 github_pat_… 或 ghp_…）</li>
        </ol>
        <input id="s-token" type="password" autocomplete="off" class="w-full border rounded-lg px-3 py-2 text-sm font-mono" placeholder="粘贴 GitHub Token" ${logged?'disabled':''} />
        <label class="flex items-start gap-2 text-xs text-slate-600">
          <input id="s-remember" type="checkbox" class="mt-0.5" ${logged?'disabled':''} />
          <span>记住登录：用「保护密码」加密 Token 后存本机（推荐）。不勾选则仅本次浏览器会话有效。</span>
        </label>
        <input id="s-pass" type="password" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="保护密码（勾选记住登录时必填，≥4 位）" ${logged?'disabled':''} />
        <div class="flex flex-wrap gap-2">
          <button id="s-login" class="bg-brand-600 text-white text-sm font-semibold px-4 py-2 rounded-lg" ${logged?'disabled':''}>登录并同步</button>
          ${logged?`<button id="s-logout" class="text-sm border border-slate-200 px-4 py-2 rounded-lg">退出登录</button>
          <button id="s-pull" class="text-sm border border-slate-200 px-4 py-2 rounded-lg">立即拉取</button>
          <button id="s-push" class="text-sm border border-slate-200 px-4 py-2 rounded-lg">立即推送</button>`:''}
        </div>
        <p id="s-sync-msg" class="text-xs text-slate-400"></p>
      </div>`}

      <div class="mt-4 text-[11px] text-slate-400 leading-relaxed bg-amber-50 border border-amber-100 rounded-xl px-3 py-2">
        <p class="font-semibold text-amber-800 mb-1">Token 如何妥善保存？</p>
        <p>纯前端页面<strong>无法</strong>做到银行级保密（本机 DevTools 仍可能看到解密后的 Token）。我们采用的最佳实践是：① 只用 gist 权限的细粒度 Token；② 用你设的保护密码 AES-GCM 加密后写入 localStorage；③ 数据放在私有 Gist；④ 公用电脑请勿勾选「记住登录」，用完点退出。若 Token 泄露，立刻在 GitHub 撤销即可。</p>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-6 border">
      <h2 class="text-lg font-semibold">计划与词库</h2>
      <p class="text-sm text-slate-400 mt-1">当前第 ${task.day}/${PLAN.TOTAL_DAYS} 天 · 词库 ${getStats().total} 词</p>
      <button id="s-advance" class="mt-4 bg-brand-600 text-white text-sm font-semibold px-4 py-2 rounded-lg">推进到下一天</button>
      <span id="s-adv-msg" class="ml-2 text-xs text-slate-400"></span>
    </div>
    <div class="bg-white rounded-2xl p-6 border">
      <h2 class="text-lg font-semibold">增量导入（Excel 粘贴）</h2>
      <p class="text-xs text-slate-400 mt-1">格式：单词[Tab]音标[Tab]释义，每行一词；重复自动拦截</p>
      <textarea id="s-import" rows="6" class="mt-3 w-full border rounded-lg px-3 py-2 text-sm font-mono" placeholder="abate\t/əˈbeɪt/\t减弱"></textarea>
      <button id="s-import-btn" class="mt-3 bg-brand-600 text-white text-sm font-semibold px-4 py-2 rounded-lg">增量导入</button>
      <p id="s-import-msg" class="text-xs mt-2"></p>
    </div>
    <div class="bg-white rounded-2xl p-6 border">
      <h2 class="text-lg font-semibold">数据</h2>
      <button id="s-reset" class="mt-3 text-sm text-accent border border-red-200 px-4 py-2 rounded-lg">重置为内置 20 词样例</button>
    </div>
  </div>`;
}
function mountSettings(root){
  const msg = root.querySelector('#s-sync-msg');
  const setMsg = (t, ok)=>{ if(!msg) return; msg.className='text-xs '+(ok?'text-brand-600':'text-accent'); msg.textContent=t; };

  root.querySelector('#s-unlock')?.addEventListener('click', async ()=>{
    const m = root.querySelector('#s-unlock-msg');
    try{
      await unlockEncrypted(root.querySelector('#s-unlock-pass').value);
      m.className='text-xs text-brand-600'; m.textContent='解锁成功，已同步云端。';
      renderChrome();
      setTimeout(()=>{ location.hash='#/settings'; renderRoute(); }, 400);
    }catch(e){
      m.className='text-xs text-accent'; m.textContent='解锁失败：'+(e.message||e)+'（密码错误？）';
    }
  });
  root.querySelector('#s-forget')?.addEventListener('click', ()=>{
    if(!confirm('清除本机保存的加密 Token？云端 Gist 数据不会删除。')) return;
    githubLogout();
    renderRoute();
  });

  root.querySelector('#s-login')?.addEventListener('click', async ()=>{
    const token = root.querySelector('#s-token').value;
    const remember = root.querySelector('#s-remember').checked;
    const passphrase = root.querySelector('#s-pass').value;
    setMsg('正在登录 GitHub…', true);
    try{
      const r = await githubLogin(token, { remember, passphrase, autoSync:true });
      setMsg(`✅ 登录成功 @${r.user.login}。${r.pull.message}`, true);
      renderChrome();
      setTimeout(()=>renderRoute(), 500);
    }catch(e){
      setMsg('❌ '+(e.message||e), false);
      cloud.token=null; cloud.unlocked=false;
    }
  });
  root.querySelector('#s-logout')?.addEventListener('click', ()=>{
    githubLogout();
    renderRoute();
  });
  root.querySelector('#s-pull')?.addEventListener('click', async ()=>{
    try{ const r=await pullFromGist(); setMsg(r.message, true); renderChrome(); renderRoute(); }
    catch(e){ setMsg('❌ '+(e.message||e), false); }
  });
  root.querySelector('#s-push')?.addEventListener('click', async ()=>{
    try{ const r=await pushToGist(); setMsg(r.message, true); }
    catch(e){ setMsg('❌ '+(e.message||e), false); }
  });

  root.querySelector('#s-advance')?.addEventListener('click', ()=>{
    const ok=advanceDay();
    root.querySelector('#s-adv-msg').textContent=ok?`已推进到第 ${activeBook().currentPlanDay} 天`:'已是最后一天';
    renderChrome();
  });
  root.querySelector('#s-import-btn')?.addEventListener('click', ()=>{
    const lines=root.querySelector('#s-import').value.split(/\n/).map(l=>l.trim()).filter(Boolean);
    const r=appendWords(lines);
    root.querySelector('#s-import-msg').innerHTML=`<span class="text-brand-600">成功导入 ${r.added} 词，当前共 ${r.total} 词。</span>`+
      (r.skipped?`<div class="mt-2 text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">⚠️ 拦截 ${r.skipped} 个重复：${r.duplicateWords.map(escapeHtml).join(', ')}</div>`:'');
    renderChrome();
  });
  root.querySelector('#s-reset')?.addEventListener('click', ()=>{
    if(!confirm('确定重置？本地进度将清空（云端需手动再推送才会覆盖）。')) return;
    const book=defaultBook(); state={activeBookId:book.id, wordbooks:[book]}; persist(); location.reload();
  });
}

const mounts = { vocab:mountVocab, mistakes:mountMistakes, practice:mountPractice, sentence:mountSentence, settings:mountSettings };
const renders = { dashboard:renderDashboard, vocab:renderVocab, mistakes:renderMistakes, practice:renderPractice, sentence:renderSentence, settings:renderSettings };

function openDrawer(){ document.body.classList.add('drawer-open'); }
function closeDrawer(){ document.body.classList.remove('drawer-open'); }

function renderNav(active){
  document.getElementById('nav').innerHTML = routes.map(r=>`
    <a href="#/${r.key}" class="nav-item ${r.key===active?'active':''}"><span>${r.icon}</span><span>${r.label}</span></a>`).join('');
  document.querySelectorAll('#nav .nav-item').forEach(a=>{
    a.addEventListener('click', ()=> closeDrawer());
  });
}
function renderChrome(){
  const task=getTodayTask();
  const dateEl=document.getElementById('today-date');
  if(dateEl){
    dateEl.textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  }
  document.getElementById('active-book-name').textContent=task.bookName;
  const denom=task.todayGoal||1;
  const pct=Math.min(100, Math.round((task.learnedToday/denom)*100));
  document.getElementById('daily-progress-bar').style.width=pct+'%';
  document.getElementById('daily-progress-text').textContent=`第 ${task.day}/${PLAN.TOTAL_DAYS} 天 · 单词 ${task.learnedToday}/${task.todayGoal}`;
}
function renderRoute(){
  detachVocabKey();
  if(activeTip){ activeTip.remove(); activeTip=null; }
  closeDrawer();
  const key=(location.hash.replace('#/','')||'dashboard').trim();
  const route=routes.find(r=>r.key===key)||routes[0];
  renderNav(route.key);
  document.getElementById('page-title').textContent=route.label;
  document.getElementById('page-subtitle').textContent=route.subtitle||'';
  const view=document.getElementById('view');
  view.innerHTML = (renders[route.key]||renderDashboard)();
  (mounts[route.key]||(()=>{}))(view);
}

document.getElementById('menu-btn')?.addEventListener('click', openDrawer);
document.getElementById('drawer-close')?.addEventListener('click', closeDrawer);
document.getElementById('sidebar-overlay')?.addEventListener('click', closeDrawer);
window.addEventListener('resize', ()=>{ if(window.innerWidth>=768) closeDrawer(); });

window.addEventListener('hashchange', renderRoute);
window.addEventListener('gre:progress', renderChrome);
if(!location.hash) location.hash='#/dashboard';
renderRoute();
renderChrome();
tryRestoreSession().then(()=>{ renderChrome(); }).catch(()=>{});
</script>
